<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='rahulstyles.css') }}">
    <style>
        /* Center the result container */
        .result-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .result-container h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .result-container p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }

        .result-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Prediction Result</h1>
    </header>
    <main>
        <div class="result-container">
            <h2>Prediction: {{ prediction }}</h2>
            <p>Confidence Score: {{ confidence }}%</p>
            <img src="{{ image_path }}" alt="Uploaded Image">
            <form action="{{ url_for('download_pdf') }}" method="POST" style="display: inline;">
                <input type="hidden" name="prediction" value="{{ prediction }}">
                <input type="hidden" name="confidence" value="{{ confidence }}">
                <input type="hidden" name="image_path" value="{{ image_path }}">
                <button type="submit" class="btn">Download Report</button>
            </form>
            <a href="{{ url_for('index_page') }}" class="btn">Upload Another Image</a>
        </div>
    </main>
</body>
</html>
