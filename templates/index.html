  <h2>Upload Oral Image for Cancer Detection</h2>

  <form action="/predict" method="post" enctype="multipart/form-data" id="full-form">

  <script>
    let mediaRecorder;
    let audioChunks = [];
    const recordBtn = document.getElementById("record-btn");
    const recordStatus = document.getElementById("record-status");
    const audioPlayback = document.getElementById("audio-playback");
    const audioBlobInput = document.getElementById("audio-blob");
    let isRecording = false;

    recordBtn.onclick = async () => {
      if (!isRecording) {
        // Start recording
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/wav' });
          const url = URL.createObjectURL(blob);
          audioPlayback.src = url;
          audioPlayback.style.display = "block";

          // Convert blob to base64 for form submission
          const reader = new FileReader();
          reader.onloadend = function () {
            const base64data = reader.result;
            audioBlobInput.value = base64data;
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "⏹️ Stop Recording";
        recordStatus.textContent = "Recording...";
        recordStatus.style.color = "red";
      } else {
        // Stop recording
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = "🎙️ Start Recording";
        recordStatus.textContent = "Recording stopped";
        recordStatus.style.color = "green";
      }
    };

    const imageInput = document.getElementById("image-input");
    const imagePreview = document.getElementById("image-preview");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          imagePreview.src = e.target.result;
          imagePreview.style.display = "block";
        };

        reader.readAsDataURL(file);
      } else {
        imagePreview.style.display = "none";
      }
    });
  </script>

  <script>
  const startCameraBtn = document.getElementById("start-camera-btn");
  const captureBtn = document.getElementById("capture-btn");
  const retakeBtn = document.getElementById("retake-btn");
  const cameraPreview = document.getElementById("camera-preview");
  const capturedImage = document.getElementById("captured-image");
  const capturedImageData = document.getElementById("captured-image-data");
  const imageUpload = document.getElementById("image-upload");

  let cameraStream = null;

  // Open Camera
  startCameraBtn.addEventListener("click", async () => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
        cameraPreview.srcObject = cameraStream;
        cameraPreview.style.display = "block";
        captureBtn.style.display = "inline-block";
        startCameraBtn.style.display = "none";
      } catch (error) {
        alert("Unable to access the camera. Please check your permissions.");
      }
    } else {
      alert("Camera is not supported on this device.");
    }
  });

  // Capture Image
  captureBtn.addEventListener("click", () => {
    const canvas = document.createElement("canvas");
    canvas.width = cameraPreview.videoWidth;
    canvas.height = cameraPreview.videoHeight;
    const context = canvas.getContext("2d");
    context.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);

    // Convert the captured image to a data URL
    const imageDataUrl = canvas.toDataURL("image/png");
    capturedImage.src = imageDataUrl;
    capturedImage.style.display = "block";
    capturedImageData.value = imageDataUrl; // Store the image data in the hidden input

    // Stop the camera
    cameraStream.getTracks().forEach(track => track.stop());
    cameraPreview.style.display = "none";
    captureBtn.style.display = "none";
    retakeBtn.style.display = "inline-block";
  });

  // Retake Image
  retakeBtn.addEventListener("click", () => {
    capturedImage.style.display = "none";
    capturedImageData.value = ""; // Clear the hidden input
    retakeBtn.style.display = "none";
    startCameraBtn.style.display = "inline-block";
  });

  // Handle Image Upload
  imageUpload.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();

      reader.onload = function (e) {
        capturedImage.src = e.target.result;
        capturedImage.style.display = "block";
        capturedImageData.value = ""; // Clear the captured image data
        cameraPreview.style.display = "none";
        captureBtn.style.display = "none";
        retakeBtn.style.display = "inline-block";
      };

      reader.readAsDataURL(file);
    }
  });

  const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
  const mobileMenu = document.querySelector('.mobile-menu');

  mobileMenuToggle.addEventListener('click', () => {
    mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
  });
  
  function showLoading() {
    document.getElementById("loading").style.display = "block";
  }
  function updateFileName() {
      const input = document.getElementById('image-upload');
      const fileNameDiv = document.getElementById('file-name');
      fileNameDiv.textContent = input.files.length > 0 ? input.files[0].name : 'No file chosen';
  }
</script>

</body>
